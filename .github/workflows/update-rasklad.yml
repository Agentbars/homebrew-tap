name: Update Rasklad cask

on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to pin (empty = latest release)'
        required: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Update cask
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result=$(./scripts/update-rasklad.sh ${{ inputs.version }})
          echo "$result"
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: startsWith(steps.update.outputs.result, 'updated')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "rasklad ${{ steps.update.outputs.result }}"
          git push
